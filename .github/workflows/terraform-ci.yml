name: "Terraform CI"
run-name: "Build #${{ github.run_number }} - ${{ github.event.head_commit.message }}"

on:
  workflow_dispatch:
 
jobs:
  Build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

        